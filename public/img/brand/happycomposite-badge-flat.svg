<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="HAPPYCOMPOSITE">
  <defs>
    <linearGradient id="hcFlatFace" gradientUnits="userSpaceOnUse" x1="0" y1="70" x2="0" y2="190">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#dfe6ee"/>
      <stop offset="1"   stop-color="#9fb0c2"/>
    </linearGradient>
    <linearGradient id="hcFlatRim" gradientUnits="userSpaceOnUse" x1="0" y1="70" x2="0" y2="190">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff6a00"/>
